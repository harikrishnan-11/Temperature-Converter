<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temprature convertor</title>
</head>

<body>
    <div class="wrapper">

        <h1> INSTANT TEMPERATURE CONVERTER</h1>
        <p>Convert all type of temperature smoothly.</p>

        <div class="container">

            <div class="left">

                <p>From</p>

                <div class="inner-box">
                    
                    <p id="from">Celsius (<sup>o</sup>C)</p>

                    <input type="number" id="input" value="1" class="input">

                    <p class="placeHolder">Enter Value...</p>

                </div>

            </div>

            <div class="center">
                <p id="From"> (<sup>o</sup>C) </p> <span> = </span> <p id="To"> (<sup>o</sup>F)</p>
            </div>

            <div class="right">

                <p>To</p>

                <div class="inner-box">

                    <p id="To">Celsius (<sup>o</sup>C)</p>

                    <input type="number" id="input" value="1" class="input">

                    <p class="placeHolder">Enter Value...</p>

                </div>

            </div>
        </div>

    </div>



</body>

</html>
