<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temprature convertor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="head">
            <h1> INSTANT TEMPERATURE CONVERTER</h1>
            <p>Convert all type of temperature smoothly.</p>
        </div>

        <div class="container">

            <div class="box">

                <p>From</p>

                <div class="inner-box">

                    <p id="from">Celsius (<sup>o</sup>C)</p>

                    <input type="number" id="input" value="" class="input" placeholder="0 " maxlength="10" >

                    
                </div>
                <p class="placeHolder">Enter Value...</p>

            </div>

            <div class="center" id="center" title="click to swap">
                <div id="swap">SWAP</div>
                <div class="menu">


                    <p id="C"> <sup>o</sup>C </p> <span> = </span>
                    <p id="F"> <sup>o</sup>F</p>
                </div>
            </div>

     
            <div class="box">

                <p>To</p>

                <div class="inner-box">

                    <p id="to">Fahrenheit (<sup>o</sup>F)</p>

                    <input type="text" id="output" value="" class="input" placeholder="0" readonly>

                    
                </div>
                <p class="placeHolder" >Result...</p>

            </div>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
